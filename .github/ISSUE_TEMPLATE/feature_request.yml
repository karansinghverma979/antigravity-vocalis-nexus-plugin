name: 💡 Feature Request
description: Propose an architecture enhancement, new tool, or custom wake model.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Feature Concept
      description: What capability does this add to Vocalis-Nexus?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale & 10x Value
      description: Why is this better than current alternatives?
    validations:
      required: true
